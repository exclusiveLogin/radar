# Overlay: production images (baked dist, без bind-mount исходников).
# База — docker-compose.yml (db, ollama, observability).
name: radar

x-prod-env: &prod-env
  env_file:
    - .env
  networks:
    - radar_net
  restart: unless-stopped

x-rmq-transport: &rmq-transport
  INFRA__transport__kind: rmq
  INFRA__transport__rmq__url: amqp://${RMQ_USER:-radar}:${RMQ_PASSWORD:-radar}@rabbitmq:5672/${RMQ_VHOST:-radar}

x-worker-prod: &worker-prod
  <<: *prod-env
  build:
    context: .
    dockerfile: docker/Dockerfile.worker
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    api:
      condition: service_healthy

services:
  api:
    <<: *prod-env
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      <<: *rmq-transport
      NODE_ENV: production
      PORT: "3000"
      WORKER_PROBE_TARGETS: http://worker-ingest:3010/status
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/ready'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    <<: *prod-env
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_MAP_BASEMAP_STYLE: ${VITE_MAP_BASEMAP_STYLE:-openfreemap}
        VITE_MAP_TILES_URL: ${VITE_MAP_TILES_URL:-/tiles}
    depends_on:
      api:
        condition: service_healthy
      tiles:
        condition: service_started
    ports:
      - "${WEB_PORT:-8088}:80"

  worker-ingest:
    <<: *worker-prod
    profiles: ["prod"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      <<: *rmq-transport
      NODE_ENV: production
      RADAR_STORAGE_MODE: db
      RADAR_WORKER_ROLE: ingest
      WORKER_PROBE_HOST: 0.0.0.0
      WORKER_PROBE_PORT: ${WORKER_PROBE_PORT:-3010}
      RADAR_SESSIONS_DIR: /var/radar/sessions
    volumes:
      # Слоты с хоста (.env RADAR_SESSIONS_DIR=.radar/sessions) — не отдельный пустой volume
      - ./.radar/sessions:/var/radar/sessions:ro
    ports:
      - "${WORKER_PROBE_PORT:-3010}:3010"

  worker-backfill:
    <<: *worker-prod
    profiles: ["prod"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      <<: *rmq-transport
      NODE_ENV: production
      RADAR_STORAGE_MODE: db
      RADAR_WORKER_ROLE: backfill
      WORKER_PROBE_ENABLED: "0"
      RADAR_SESSIONS_DIR: /var/radar/sessions
    volumes:
      - ./.radar/sessions:/var/radar/sessions:ro

  worker-parse:
    <<: *worker-prod
    profiles: ["prod"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      <<: *rmq-transport
      NODE_ENV: production
      RADAR_STORAGE_MODE: db
      RADAR_WORKER_ROLE: parse
      WORKER_PROBE_ENABLED: "0"

  worker-geo:
    <<: *worker-prod
    profiles: ["prod"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      <<: *rmq-transport
      NODE_ENV: production
      RADAR_STORAGE_MODE: db
      RADAR_WORKER_ROLE: geo
      WORKER_PROBE_ENABLED: "0"
      GEO__llm__baseUrl: http://ollama:11434/v1

  worker-tracking:
    <<: *worker-prod
    profiles: ["prod"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      <<: *rmq-transport
      NODE_ENV: production
      RADAR_STORAGE_MODE: db
      RADAR_WORKER_ROLE: tracking
      WORKER_PROBE_ENABLED: "0"

  tiles:
    image: maptiler/tileserver-gl:latest
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "${TILES_PORT:-8081}:8080"
    volumes:
      - ./data/tiles/output:/data:ro
      - ./docker/tiles/stub-config.json:/stub/config.json:ro
    # Не вызывать node напрямую — иначе минуем Xvfb из docker-entrypoint.sh → "Failed to open X display".
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        if [ -f /data/config.json ]; then CONFIG=/data/config.json;
        else echo "[tiles] stub until stack tiles:sync"; CONFIG=/stub/config.json;
        fi;
        exec /usr/src/app/docker-entrypoint.sh --config "$$CONFIG"
    networks:
      - radar_net

networks:
  radar_net:
    driver: bridge

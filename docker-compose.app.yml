# Overlay: api + web + worker-роли (dev hot-reload). База — docker-compose.yml
name: radar

x-app-build: &app-build
  build:
    context: .
    dockerfile: docker/Dockerfile.dev
  working_dir: /app
  env_file:
    - .env
  volumes:
    - .:/app
    - radar_node_modules:/app/node_modules
  networks:
    - radar_net

x-rmq-transport: &rmq-transport
  DEPLOY__transport__kind: rmq
  DEPLOY__transport__rmq__url: amqp://${RMQ_USER:-radar}:${RMQ_PASSWORD:-radar}@rabbitmq:5672/${RMQ_VHOST:-radar}

services:
  api:
    <<: *app-build
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      <<: *rmq-transport
      PORT: "3000"
      WORKER_PROBE_TARGETS: http://worker-ingest:3010/status
    ports:
      - "${API_PORT:-3000}:3000"
    command: ["npm", "run", "dev", "-w", "@radar/api"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/ready'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  web:
    <<: *app-build
    profiles: ["app"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_DEV_PROXY_API: http://api:3000
      VITE_DEV_PROXY_TILES: http://tiles:8080
      VITE_MAP_TILES_URL: /tiles
      VITE_MAP_BASEMAP_STYLE: local
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-1}
    ports:
      - "${WEB_PORT:-5173}:5173"
    command: ["npm", "run", "dev", "-w", "@radar/web", "--", "--host", "0.0.0.0"]
    restart: unless-stopped

  worker-ingest:
    <<: *app-build
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      <<: *rmq-transport
      RADAR_STORAGE_MODE: db
      RADAR_WORKER_ROLE: ingest
      WORKER_PROBE_HOST: 0.0.0.0
      WORKER_PROBE_PORT: ${WORKER_PROBE_PORT:-3010}
      RADAR_SESSIONS_DIR: /var/radar/sessions
    volumes:
      - .:/app
      - radar_node_modules:/app/node_modules
      # Тот же путь, что session:deploy на хосте (RADAR_SESSIONS_DIR=.radar/sessions)
      - ./.radar/sessions:/var/radar/sessions
    ports:
      - "${WORKER_PROBE_PORT:-3010}:3010"
    command: ["npm", "run", "dev", "-w", "@radar/worker", "--ignore-scripts"]
    restart: unless-stopped

  worker-backfill:
    <<: *app-build
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      <<: *rmq-transport
      RADAR_STORAGE_MODE: db
      RADAR_WORKER_ROLE: backfill
      WORKER_PROBE_ENABLED: "0"
      RADAR_SESSIONS_DIR: /var/radar/sessions
    volumes:
      - .:/app
      - radar_node_modules:/app/node_modules
      - ./.radar/sessions:/var/radar/sessions
    command: ["npm", "run", "dev", "-w", "@radar/worker", "--ignore-scripts"]
    restart: unless-stopped

  worker-parse:
    <<: *app-build
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      <<: *rmq-transport
      RADAR_STORAGE_MODE: db
      RADAR_WORKER_ROLE: parse
      WORKER_PROBE_ENABLED: "0"
    command: ["npm", "run", "dev", "-w", "@radar/worker", "--ignore-scripts"]
    restart: unless-stopped

  worker-geo:
    <<: *app-build
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      <<: *rmq-transport
      RADAR_STORAGE_MODE: db
      RADAR_WORKER_ROLE: geo
      WORKER_PROBE_ENABLED: "0"
      # В контейнере — сервис compose, не 127.0.0.1 с хоста (.env)
      RADAR_LLM_BASE_URL: http://ollama:11434/v1
    command: ["npm", "run", "dev", "-w", "@radar/worker", "--ignore-scripts"]
    restart: unless-stopped

  worker-tracking:
    <<: *app-build
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      <<: *rmq-transport
      RADAR_STORAGE_MODE: db
      RADAR_WORKER_ROLE: tracking
      WORKER_PROBE_ENABLED: "0"
    command: ["npm", "run", "dev", "-w", "@radar/worker", "--ignore-scripts"]
    restart: unless-stopped

  # TileServer GL: тот же bind-mount что tiles:sync/build (data/tiles/output).
  # До init — stub config; после init — restart подхватывает config.json + mbtiles.
  tiles:
    image: maptiler/tileserver-gl:latest
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "${TILES_PORT:-8081}:8080"
    volumes:
      - ./data/tiles/output:/data:ro
      - ./docker/tiles/stub-config.json:/stub/config.json:ro
    # Не вызывать node напрямую — иначе минуем Xvfb из docker-entrypoint.sh → "Failed to open X display".
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        if [ -f /data/config.json ]; then CONFIG=/data/config.json;
        else echo "[tiles] stub until stack tiles:sync"; CONFIG=/stub/config.json;
        fi;
        exec /usr/src/app/docker-entrypoint.sh --config "$$CONFIG"
    networks:
      - radar_net

volumes:
  radar_node_modules:

networks:
  radar_net:
    driver: bridge

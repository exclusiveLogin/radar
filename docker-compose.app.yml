# Overlay: api + web + worker-роли (dev hot-reload). База — docker-compose.yml
# Порядок: npm-ci → api → web/workers. Без entrypoint-ретраев.
name: radar

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile.dev
  working_dir: /app
  env_file:
    - .env
  volumes:
    - .:/app
    - radar_node_modules:/app/node_modules
  networks:
    - radar_net
  restart: "no"

x-rmq: &rmq
  DEPLOY__transport__kind: rmq
  DEPLOY__transport__rmq__url: amqp://${RMQ_USER:-radar}:${RMQ_PASSWORD:-radar}@rabbitmq:5672/${RMQ_VHOST:-radar}

x-db-url: &db-url
  DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}

x-api-url: &api-url
  RADAR_API_URL: http://api:3000

x-worker-probe: &worker-probe
  WORKER_PROBE_HOST: 0.0.0.0
  WORKER_PROBE_PORT: "3010"

x-worker: &worker
  <<: *app
  profiles: ["app"]
  depends_on:
    npm-ci:
      condition: service_completed_successfully
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    api:
      condition: service_healthy
  environment:
    <<: [*db-url, *rmq, *api-url]
    RADAR_STORAGE_MODE: db
    RADAR_API_URL: http://api:3000
  command: ["npm", "run", "dev", "-w", "@radar/worker", "--ignore-scripts"]
  healthcheck:
    test:
      [
        "CMD-SHELL",
        'node -e "fetch(''http://127.0.0.1:3010/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
      ]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 180s

services:
  # Один раз наполняет общий volume node_modules под текущий package-lock.
  npm-ci:
    <<: *app
    profiles: ["app"]
    command:
      - sh
      - -c
      - |
        mark=node_modules/.radar-package-lock.json
        if [ -f "$$mark" ] && cmp -s package-lock.json "$$mark"; then
          echo "[npm-ci] node_modules ok"
          exit 0
        fi
        echo "[npm-ci] npm ci..."
        npm ci
        cp package-lock.json "$$mark"

  api:
    <<: *app
    profiles: ["app"]
    depends_on:
      npm-ci:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*db-url, *rmq]
      PORT: "3000"
      RADAR_STORAGE_MODE: db
      WORKER_PROBE_TARGETS: http://worker-ingest:3010/status
    ports:
      - "${API_PORT:-3000}:3000"
    command: ["npm", "run", "dev", "-w", "@radar/api"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/ready'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  web:
    <<: *app
    profiles: ["app"]
    depends_on:
      npm-ci:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      VITE_DEV_PROXY_API: http://api:3000
      VITE_DEV_PROXY_TILES: http://tiles:8080
      VITE_MAP_TILES_URL: /tiles
      VITE_MAP_BASEMAP_STYLE: local
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-1}
    ports:
      - "${WEB_PORT:-5173}:5173"
    command: ["npm", "run", "dev", "-w", "@radar/web", "--", "--host", "0.0.0.0"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:5173/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  worker-ingest:
    <<: *worker
    environment:
      <<: [*worker-probe, *db-url, *rmq, *api-url]
      RADAR_STORAGE_MODE: db
      RADAR_WORKER_ROLE: ingest
      RADAR_SESSIONS_DIR: /var/radar/sessions
    volumes:
      - .:/app
      - radar_node_modules:/app/node_modules
      - ./.radar/sessions:/var/radar/sessions
    ports:
      - "${WORKER_PROBE_PORT:-3010}:3010"

  worker-backfill:
    <<: *worker
    environment:
      <<: [*worker-probe, *db-url, *rmq, *api-url]
      RADAR_STORAGE_MODE: db
      RADAR_WORKER_ROLE: backfill
      RADAR_SESSIONS_DIR: /var/radar/sessions
    volumes:
      - .:/app
      - radar_node_modules:/app/node_modules
      - ./.radar/sessions:/var/radar/sessions

  worker-parse:
    <<: *worker
    environment:
      <<: [*worker-probe, *db-url, *rmq, *api-url]
      RADAR_STORAGE_MODE: db
      RADAR_WORKER_ROLE: parse

  worker-geo:
    <<: *worker
    depends_on:
      npm-ci:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      <<: [*worker-probe, *db-url, *rmq, *api-url]
      RADAR_STORAGE_MODE: db
      RADAR_WORKER_ROLE: geo
      RADAR_LLM_BASE_URL: http://ollama:11434/v1

  worker-tracking:
    <<: *worker
    environment:
      <<: [*worker-probe, *db-url, *rmq, *api-url]
      RADAR_STORAGE_MODE: db
      RADAR_WORKER_ROLE: tracking

  tiles:
    image: maptiler/tileserver-gl:latest
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "${TILES_PORT:-8081}:8080"
    volumes:
      - ./data/tiles/output:/data:ro
      - ./docker/tiles/stub-config.json:/stub/config.json:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        if [ -f /data/config.json ]; then CONFIG=/data/config.json;
        else echo "[tiles] stub until stack tiles:sync"; CONFIG=/stub/config.json;
        fi;
        exec /usr/src/app/docker-entrypoint.sh --config "$$CONFIG"
    networks:
      - radar_net

volumes:
  radar_node_modules:

networks:
  radar_net:
    driver: bridge

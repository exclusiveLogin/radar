# Overlay: api + web + worker-роли (dev hot-reload). База — docker-compose.yml
name: radar

x-app-build: &app-build
  build:
    context: .
    dockerfile: docker/Dockerfile.dev
  working_dir: /app
  env_file:
    - .env
  volumes:
    - .:/app
    - radar_node_modules:/app/node_modules
  networks:
    - radar_net

services:
  api:
    <<: *app-build
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      PORT: "3000"
      WORKER_PROBE_TARGETS: http://worker-ingest:3010/status
      RADAR_OBS_MODE: ${RADAR_OBS_MODE:-embedded}
      RADAR_OBS_SERVICE_URL: ${RADAR_OBS_SERVICE_URL:-http://observability:3020}
      RADAR_OBS_READ_MODE: ${RADAR_OBS_READ_MODE:-embedded}
    ports:
      - "${API_PORT:-3000}:3000"
    command: ["npm", "run", "dev", "-w", "@radar/api"]
    restart: unless-stopped

  web:
    <<: *app-build
    profiles: ["app"]
    depends_on:
      - api
    environment:
      VITE_DEV_PROXY_API: http://api:3000
      VITE_DEV_PROXY_TILES: http://tiles:8080
      VITE_MAP_TILES_URL: /tiles
      VITE_MAP_BASEMAP_STYLE: local
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-1}
    ports:
      - "${WEB_PORT:-5173}:5173"
    command: ["npm", "run", "dev", "-w", "@radar/web", "--", "--host", "0.0.0.0"]
    restart: unless-stopped

  worker-ingest:
    <<: *app-build
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      RADAR_STORAGE_MODE: db
      RADAR_OBS_MODE: ${RADAR_OBS_MODE:-embedded}
      RADAR_OBS_SERVICE_URL: ${RADAR_OBS_SERVICE_URL:-http://observability:3020}
      RADAR_WORKER_ROLE: ingest
      WORKER_PROBE_HOST: 0.0.0.0
      WORKER_PROBE_PORT: ${WORKER_PROBE_PORT:-3010}
      RADAR_SESSIONS_DIR: /var/radar/sessions
    volumes:
      - .:/app
      - radar_node_modules:/app/node_modules
      - radar_sessions_data:/var/radar/sessions
    ports:
      - "${WORKER_PROBE_PORT:-3010}:3010"
    command: ["npm", "run", "dev", "-w", "@radar/worker", "--ignore-scripts"]
    restart: unless-stopped

  worker-backfill:
    <<: *app-build
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      RADAR_STORAGE_MODE: db
      RADAR_OBS_MODE: ${RADAR_OBS_MODE:-embedded}
      RADAR_OBS_SERVICE_URL: ${RADAR_OBS_SERVICE_URL:-http://observability:3020}
      RADAR_WORKER_ROLE: backfill
      WORKER_PROBE_ENABLED: "0"
      RADAR_SESSIONS_DIR: /var/radar/sessions
    volumes:
      - .:/app
      - radar_node_modules:/app/node_modules
      - radar_sessions_data:/var/radar/sessions
    command: ["npm", "run", "dev", "-w", "@radar/worker", "--ignore-scripts"]
    restart: unless-stopped

  worker-phase:
    <<: *app-build
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      RADAR_STORAGE_MODE: db
      RADAR_OBS_MODE: ${RADAR_OBS_MODE:-embedded}
      RADAR_OBS_SERVICE_URL: ${RADAR_OBS_SERVICE_URL:-http://observability:3020}
      RADAR_WORKER_ROLE: phase
      WORKER_PROBE_ENABLED: "0"
    command: ["npm", "run", "dev", "-w", "@radar/worker", "--ignore-scripts"]
    restart: unless-stopped

  worker-tracking:
    <<: *app-build
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      RADAR_STORAGE_MODE: db
      RADAR_OBS_MODE: ${RADAR_OBS_MODE:-embedded}
      RADAR_OBS_SERVICE_URL: ${RADAR_OBS_SERVICE_URL:-http://observability:3020}
      RADAR_WORKER_ROLE: tracking
      TRACKING_DAEMON_ENABLED: "true"
      WORKER_PROBE_ENABLED: "0"
    command: ["npm", "run", "dev", "-w", "@radar/worker", "--ignore-scripts"]
    restart: unless-stopped

volumes:
  radar_node_modules:
  radar_sessions_data:

networks:
  radar_net:
    driver: bridge

name: radar

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Docker default shm=64MB — мало для PG parallel/hash при fold+heatmap; Windows Desktop особенно.
    shm_size: "512mb"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
    command:
      - postgres
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - work_mem=4MB
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - radar_pg_data:/var/lib/postgresql/data
    networks:
      - radar_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"${POSTGRES_USER:-radar}\" -d \"${POSTGRES_DB:-radar}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.0
    container_name: radar-pgadmin
    restart: unless-stopped
    environment:
      # pgAdmin 9+ не принимает TLD .local как валидный email — только «настоящий» вид
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-radar_pgadmin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: "30"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - radar_pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - radar_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/misc/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  adminer:
    image: adminer:4
    container_name: radar-adminer
    restart: unless-stopped
    environment:
      # Хост Postgres внутри сети compose (логин/пароль — в UI из POSTGRES_* в .env)
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - radar_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: radar-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER:-radar}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASSWORD:-radar}
      RABBITMQ_DEFAULT_VHOST: ${RMQ_VHOST:-radar}
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus &&
             docker-entrypoint.sh rabbitmq-server"
    ports:
      - "${RMQ_AMQP_PORT:-5672}:5672"
      - "${RMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - radar_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - radar_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: radar-prometheus
    restart: unless-stopped
    profiles: ["obs"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - radar_prometheus_data:/prometheus
    networks:
      - radar_net
    depends_on:
      rabbitmq:
        condition: service_healthy
      cadvisor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: radar-cadvisor
    restart: unless-stopped
    profiles: ["obs"]
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/lib/containerd:/var/lib/containerd:ro
    networks:
      - radar_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  docker-health-exporter:
    image: ghcr.io/gladioluss/docker_healthcheck_exporter:1.0.1
    container_name: radar-docker-health-exporter
    restart: unless-stopped
    profiles: ["obs"]
    environment:
      LISTEN: 0.0.0.0:9102
      REFRESH_INTERVAL_SECONDS: 5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - radar_net

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: radar-postgres-exporter
    restart: unless-stopped
    profiles: ["obs"]
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}?sslmode=disable
    networks:
      - radar_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: radar-node-exporter
    restart: unless-stopped
    profiles: ["obs"]
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    networks:
      - radar_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: grafana/grafana:11.5.2
    container_name: radar-grafana
    restart: unless-stopped
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-radar_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - radar_grafana_data:/var/lib/grafana
    networks:
      - radar_net
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama:
    image: ollama/ollama:0.30.0-rc12
    restart: unless-stopped
    # app — вместе с docker:dev; llm/llm-ui — cold-up и ручной profile
    profiles: ["app", "llm", "llm-ui", "prod"]
    env_file:
      - .env
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      RADAR_LLM_MODEL: ${RADAR_LLM_MODEL:-qwen2.5:3b}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - radar_ollama_data:/root/.ollama
      - ./docker/ollama-entrypoint.sh:/docker/ollama-entrypoint.sh:ro
      - ./docker/ollama-healthcheck.sh:/docker/ollama-healthcheck.sh:ro
    entrypoint: ["/bin/sh", "/docker/ollama-entrypoint.sh"]
    networks:
      - radar_net
    healthcheck:
      test: ["CMD", "/bin/sh", "/docker/ollama-healthcheck.sh"]
      interval: 30s
      timeout: 20s
      retries: 12
      start_period: 1800s
    stop_grace_period: 30s
    # GPU: docker-compose.override.yml → deploy.resources.reservations.devices (см. docker-dev-stack.md)

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    profiles: ["llm-ui"]
    ports:
      - "${OPEN_WEBUI_PORT:-3001}:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - radar_open_webui_data:/app/backend/data
    networks:
      - radar_net
    depends_on:
      ollama:
        condition: service_healthy

  observability:
    build:
      context: .
      dockerfile: packages/observability/Dockerfile
    restart: unless-stopped
    profiles: ["obs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://radar:radar@db:5432/radar}
      PORT: "3020"
      OBS_HOST: 0.0.0.0
    ports:
      - "${OBS_PORT:-3020}:3020"
    networks:
      - radar_net
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: node:22-alpine
    restart: unless-stopped
    profiles: ["worker"]
    working_dir: /app
    command: ["sh", "-c", "npm run start -w @radar/worker"]
    volumes:
      - .:/app
      - ./.radar/sessions:/var/radar/sessions
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://radar:radar@db:5432/radar}
      RADAR_STORAGE_MODE: db
      RADAR_SESSIONS_DIR: /var/radar/sessions
      RADAR_INGEST_POLL_MS: ${RADAR_INGEST_POLL_MS:-2000}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_MTPROXY_HOST: ${TELEGRAM_MTPROXY_HOST:-}
      TELEGRAM_MTPROXY_PORT: ${TELEGRAM_MTPROXY_PORT:-}
      TELEGRAM_MTPROXY_SECRET: ${TELEGRAM_MTPROXY_SECRET:-}
    networks:
      - radar_net
    depends_on:
      db:
        condition: service_healthy

networks:
  radar_net:
    driver: bridge

volumes:
  radar_pg_data:
  radar_pgadmin_data:
  radar_rabbitmq_data:
  radar_prometheus_data:
  radar_grafana_data:
  radar_ollama_data:
  radar_open_webui_data:

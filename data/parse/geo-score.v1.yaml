# ADR-027: SSOT весовой матрицы geo-кандидатов.
# Калибровка порога — только этот файл (без правки кода).
schemaVersion: 1
revision: "2026-08-11.1"

# Стартовый score до факторов.
base: 1.0

# Минимум place-hits другого региона, чтобы считать его «явным кластером».
majorityClusterMin: 3

# Materialize gate (planFinalizeMerge).
# enabled:false → audit: score пишется, materialize не режется.
# threshold 0.25 режет adjectiveStem+minorityRegion (Северск/Кубань ≈ 0.20),
# пропускает unique city без штрафов и одиночный imprecise без minority.
materializeGate:
  enabled: true
  threshold: 0.25

factors:
  # Единственный NP kind≥city с этим stem в пуле.
  uniqueStem:
    weight: 0.15
  # Омоним без regionScope (ADR-012 geoImprecise).
  imprecise:
    weight: -0.2
  # Матч через эвристику «…ский → …ск», не буквальный stem.
  adjectiveStem:
    weight: -0.45
  # Регион кандидата минорен на фоне кластера другого субъекта.
  minorityRegion:
    weight: -0.5
  # place.regionIso ∉ явных субъектов текста при geoConflict.
  geoConflict:
    weight: -0.35
  # Рекламный перечень городских каналов.
  channelPromo:
    weight: -0.7
  # Scaled: weight * (llmConfidence - 0.5) * 2 → [-weight .. +weight].
  llmConfidence:
    kind: scaled
    weight: 0.25
  # Signed: confirm → +weight*confidence, reject → −weight*confidence.
  llmValidatorConfidence:
    weight: 0.3
  # LLM gap-fill: место есть в raw, нет в каталоге (штатно, валидатор аудитит).
  llmOnly:
    weight: -0.35
  # Галлюцинация: нет опоры в raw. base+maxLlmConf+вес < threshold.
  llmUngrounded:
    weight: -1.05

# LLM Validator phase trigger (ADR-027 extension).
# off — не вызывать; on — все geo-кандидаты; auto — borderline + llmOnly/llmUngrounded.
llmValidator:
  trigger: auto
  borderlineMargin: 0.15

# Prometheus собирает инфраструктурные метрики RabbitMQ и Docker-контейнеров.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Отдельный endpoint сохраняет labels конкретных очередей и exchanges.
  - job_name: rabbitmq-per-object
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: docker-health
    static_configs:
      - targets: ["docker-health-exporter:9102"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: node-runtime-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["api:3000"]

  - job_name: node-runtime-workers
    static_configs:
      - targets:
          - "worker-ingest:3010"
          - "worker-backfill:3010"
          - "worker-parse:3010"
          - "worker-geo:3010"
          - "worker-tracking:3010"
